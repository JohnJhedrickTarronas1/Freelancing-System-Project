{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><span class="eyebrow">UPDATES</span><h1>Notifications</h1><p>Booking and account activity in one place.</p></div></div><section class="panel">{% for n in items %}<a class="notification-row" href="{{ n.link|default:'#' }}"><span class="notification-dot"></span><span>{{ n.message }}<small>{{ n.created_at|date:'M d, Y · g:i A' }}</small></span></a>{% empty %}<p class="muted">You're all caught up.</p>{% endfor %}</section>{% endblock %}
